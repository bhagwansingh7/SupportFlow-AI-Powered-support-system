name: Backend + Frontend CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker Compose
        run: docker compose version

      - name: Build Backend
        working-directory: ./Backend
        run: docker compose build

      - name: Build Frontend
        working-directory: ./Frontend
        run: docker compose build

